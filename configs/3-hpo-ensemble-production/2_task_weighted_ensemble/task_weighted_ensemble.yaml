# Output Configuration
# --------------------
output:
  predictions_dir: "assets/submissions/task_weighted_ensemble/predictions"
  submission_file: "assets/submissions/task_weighted_ensemble/submission.csv"

# MLflow Configuration
# --------------------
mlflow:
  tracking: true
  tracking_uri: http://127.0.0.1:8084
  experiment_name: task_weighted_ensemble
  run_name: "best_per_task_v2_no_dec16"
  tags:
    ensemble_type: task_weighted_selection
    num_models: 4
    strategy: select_best_per_task
    note: "Dec-16 weights unavailable"
# Notes
# -----
# This ensemble strategy leverages the observation that different model
# architectures excel at different task categories:
#
# - Chemprop+MoE (Jan-05): Best for physicochemical (LogD) and metabolism (MLM CLint), MBPB
# - Chemprop Large (Jan-07): Best for permeability (Caco-2 tasks) and solubility (KSOL)
# - Chemprop Baseline (Jan-06): Best available for HLM CLint
# - Chemeleon+MoE (Jan-08): Best for protein binding (MPPB, MGMB)
#
# NOTE: Dec-16 baseline achieved best ranks for KSOL (#10), MBPB (#23), and MGMB (#2),
# but model weights are no longer available. Using next-best models instead.
#
# By selecting the best available model for each task, we aim to achieve optimal
# per-task performance and improve overall MA-RAE ranking.
target_clipping:
  enabled: true
  apply_to_individual_models: false
  apply_after_ensemble: true
  clip_ranges:
    LogD: [-3, 7]
    Log KSOL: [-3, 2.52]
    Log HLM CLint: [-1.31, 4.5]
    Log MLM CLint: [-1.31, 4.5]
    Log Caco-2 Permeability Papp A>B: [-3.0, 2.0]
    Log Caco-2 Permeability Efflux: [-0.75, 2.8]
    Log MPPB: [-6.0, 2.0]
    Log MBPB: [-6.0, 2.0]
    Log MGMB: [-6.0, 2.0]
