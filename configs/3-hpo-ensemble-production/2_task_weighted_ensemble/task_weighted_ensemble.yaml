# Model Configurations
# --------------------
# Reference configs for each model type used in the ensemble.
# NOTE: Dec-16 baseline excluded - weights no longer available.

model_configs:
  chemprop_moe:
    description: "Jan 05 MoE - Strong on LogD, MLM CLint, MBPB"
    config_path: "configs/3-hpo-ensemble-production/0_chemprop_v1/ensemble_chemprop_hpo_011.yaml"
    hyperparameters:
      depth: 6
      message_hidden_dim: 400
      ffn_type: mixture_of_experts
      num_layers: 1
      hidden_dim: 500
      n_experts: 2
      dropout: 0.2
      task_oversampling_alpha: 0.0
      seed: 42

  chemprop_large:
    description: "Jan 07 Large - Strong on Caco-2 tasks, KSOL"
    config_path: "configs/3-hpo-ensemble-production/0_chemprop_v1/ensemble_chemprop_hpo_033.yaml"
    hyperparameters:
      depth: 5
      message_hidden_dim: 1100
      ffn_type: regression
      num_layers: 2
      hidden_dim: 900
      dropout: 0.05
      task_oversampling_alpha: 0.0
      seed: 42

  chemprop_baseline_jan06:
    description: "Jan 06 Baseline (retrained) - Strong on HLM CLint"
    config_path: "configs/3-hpo-ensemble-production/0_chemprop_v1/ensemble_chemprop_hpo_001.yaml"
    hyperparameters:
      depth: 3
      message_hidden_dim: 700
      ffn_type: regression
      num_layers: 4
      hidden_dim: 200
      dropout: 0.15
      task_oversampling_alpha: 0.02
      seed: 42

  chemeleon_moe:
    description: "Jan 08 Chemeleon - Strong on plasma binding (MPPB, MGMB)"
    config_path: "configs/3-hpo-ensemble-production/1_chemeleon_v1/ensemble_chemeleon_hpo_003.yaml"
    hyperparameters:
      checkpoint_path: auto
      freeze_encoder: false
      ffn_type: mixture_of_experts
      ffn_hidden_dim: 400
      ffn_num_layers: 2
      n_experts: 7
      dropout: 0.248
      task_oversampling_alpha: 0.651
      seed: 42

# Ensemble Strategy
# -----------------
ensemble:
  strategy: task_weighted_selection
  aggregation_method: select_best_per_task

  # Alternative strategies to explore:
  # - weighted_average: Weight predictions by inverse rank
  # - stacking: Train meta-learner on model predictions
  # - voting: Majority vote for classification tasks

# Prediction Paths
# ----------------
# Paths to cached predictions from each submission.
# NOTE: Dec-16 excluded - model weights lost.
prediction_sources:
  "2026-01-05":
    blind_predictions: "assets/submissions/2026-01-05/mlflow-artifacts/6/c781fb7efe4a4b70a6fb6263dd3dd8e9/artifacts/predictions/blind_predictions.csv"
    experiment_id: 6

  "2026-01-06":
