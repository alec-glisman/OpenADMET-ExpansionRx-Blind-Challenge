# Task-Weighted Ensemble Configuration
# =====================================
# This config defines a task-specific model selection strategy based on
# historical submission performance analysis (see SUBMISSIONS.md).
#
# Strategy: Select the best-performing model's predictions for each task
# based on leaderboard rankings from Jan 5-8, 2026.
#
# NOTE: Dec 16, 2025 model weights were lost and cannot be used for ensembling.
#
# Expected improvement: Combine best-in-class predictions per task category.

# Task-to-Model Mapping
# ---------------------
# Each task is assigned to the model that achieved the best rank for that task
# (excluding Dec-16 baseline whose weights are unavailable).
#
# LogD            → Jan-05 MoE         (rank 15, MAE 0.31)
# KSOL            → Jan-07 Large       (rank 15, MAE 0.34)
# MLM CLint       → Jan-05 MoE         (rank 12, MAE 0.34)
# HLM CLint       → Jan-06 Baseline    (rank 35, MAE 0.30)
# Caco-2 Efflux   → Jan-07 Large       (rank 53, MAE 0.33)
# Caco-2 Papp A>B → Jan-07 Large       (rank 16, MAE 0.22)
# MPPB            → Jan-08 Chemeleon   (rank 24, MAE 0.17)
# MBPB            → Jan-05 MoE         (rank 51, MAE 0.15)
# MGMB            → Jan-08 Chemeleon   (rank 5,  MAE 0.15)

task_model_assignment:
  LogD:
    model: chemprop_moe
    source_submission: "2026-01-05"
    mlflow_run_id: "c781fb7efe4a4b70a6fb6263dd3dd8e9"
    expected_rank: 15
    expected_mae: 0.31

  Log KSOL:
    model: chemprop_large
    source_submission: "2026-01-07"
    mlflow_run_id: "5ef1d4104f42489184188968ede410d6"
    expected_rank: 15
    expected_mae: 0.34

  Log MLM CLint:
    model: chemprop_moe
    source_submission: "2026-01-05"
    mlflow_run_id: "c781fb7efe4a4b70a6fb6263dd3dd8e9"
    expected_rank: 12
    expected_mae: 0.34

  Log HLM CLint:
    model: chemprop_baseline_jan06
    source_submission: "2026-01-06"
    mlflow_run_id: "ca2760b28f5945ee9b387915db9da875"
    expected_rank: 35
    expected_mae: 0.30

  Log Caco-2 Permeability Efflux:
    model: chemprop_large
    source_submission: "2026-01-07"
    mlflow_run_id: "5ef1d4104f42489184188968ede410d6"
    expected_rank: 53
    expected_mae: 0.33

  Log Caco-2 Permeability Papp A>B:
    model: chemprop_large
    source_submission: "2026-01-07"
    mlflow_run_id: "5ef1d4104f42489184188968ede410d6"
    expected_rank: 16
    expected_mae: 0.22

  Log MPPB:
    model: chemeleon_moe
    source_submission: "2026-01-08"
    mlflow_run_id: "d7d51490fea9458e99e8e6677f425c37"
    expected_rank: 24
    expected_mae: 0.17

  Log MBPB:
    model: chemprop_moe
    source_submission: "2026-01-05"
    mlflow_run_id: "c781fb7efe4a4b70a6fb6263dd3dd8e9"
    expected_rank: 51
    expected_mae: 0.15

  Log MGMB:
    model: chemeleon_moe
    source_submission: "2026-01-08"
