data:
  data_dir: assets/dataset/split_train_val/v3/quality_high/bitbirch/multilabel_stratified_kfold/data
  splits: null
  folds: null
  test_file: assets/dataset/set/local_test.csv
  blind_file: assets/dataset/set/blind_test.csv
  output_dir: null
  smiles_col: SMILES
  target_cols:
    - LogD
    - Log KSOL
    - Log HLM CLint
    - Log MLM CLint
    - Log Caco-2 Permeability Papp A>B
    - Log Caco-2 Permeability Efflux
    - Log MPPB
    - Log MBPB
    - Log MGMB
model:
  type: catboost
  fingerprint:
    type: morgan
    morgan:
      radius: 2
      n_bits: 2048
      use_chirality: false
  catboost:
    iterations: 500
    depth: 8
    learning_rate: 0.05
    l2_leaf_reg: 3.0
    subsample: 0.8
    random_strength: 0.5
    random_seed: 42
    verbose: false
    thread_count: -1
ray:
  max_parallel: 5
  num_cpus: null
  num_gpus: null
mlflow:
  tracking: true
  tracking_uri: http://127.0.0.1:8084
  experiment_name: Default
  run_name: null
  nested: true
post_training:
  generate_plots: true
  plot_dpi: 150
  plot_formats:
    - png
  cache_predictions: true
  compute_test_metrics: true
  compute_train_metrics: false
logging:
  enabled: true
  verbose: 0
  max_total_logs_gb: 1.0
  fail_on_upload_error: true
target_clipping:
  enabled: true
  apply_to_individual_models: false
  apply_after_ensemble: true
  clip_ranges:
    LogD: [-3, 7]
    Log KSOL: [-3, 2.52]
    Log HLM CLint: [-1.31, 4.5]
    Log MLM CLint: [-1.31, 4.5]
    Log Caco-2 Permeability Papp A>B: [-3.0, 2.0]
    Log Caco-2 Permeability Efflux: [-0.75, 2.8]
    Log MPPB: [-6.0, 2.0]
    Log MBPB: [-6.0, 2.0]
    Log MGMB: [-6.0, 2.0]
