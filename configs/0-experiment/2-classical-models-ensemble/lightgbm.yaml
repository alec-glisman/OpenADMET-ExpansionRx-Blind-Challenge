data:
  data_dir: assets/dataset/split_train_val/v3/quality_high/bitbirch/multilabel_stratified_kfold/data
  splits: null
  folds: null
  test_file: assets/dataset/set/local_test.csv
  blind_file: assets/dataset/set/blind_test.csv
  output_dir: null
  smiles_col: SMILES
  target_cols:
    - LogD
    - Log KSOL
    - Log HLM CLint
    - Log MLM CLint
    - Log Caco-2 Permeability Papp A>B
    - Log Caco-2 Permeability Efflux
    - Log MPPB
    - Log MBPB
    - Log MGMB
model:
  type: lightgbm
  fingerprint:
    type: morgan
    morgan:
      radius: 2
      n_bits: 2048
      use_chirality: false
  lightgbm:
    n_estimators: 500
    max_depth: 12
    learning_rate: 0.05
    num_leaves: 63
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
    verbose: -1
ray:
  max_parallel: 5
  num_cpus: null
  num_gpus: null
mlflow:
  tracking: true
  tracking_uri: http://127.0.0.1:8084
  experiment_name: Default
  run_name: null
  nested: true
post_training:
  generate_plots: true
  plot_dpi: 150
  plot_formats:
    - png
  cache_predictions: true
  compute_test_metrics: true
  compute_train_metrics: false
logging:
  enabled: true
  verbose: 0
  max_total_logs_gb: 1.0
  fail_on_upload_error: true
