# Example Chemprop Configuration with Performance Optimizations Enabled
# =======================================================================
#
# This configuration demonstrates all available performance optimization features.
# For production use, enable optimizations incrementally and validate metrics remain
# within acceptable tolerance (≤0.5% variation recommended).
#
# Expected speedup with all optimizations: 10-25% reduction in training time
# See CHANGELOG.md and OPTIMIZATION_IMPLEMENTATION_SUMMARY.md for details.

# Model configuration
model:
  type: chemprop
  smiles_col: smiles
  target_cols:
    - LogD_mean
    - Log_KSOL_mean
    - Log_HLM_CLint_mean

# ================================
# PERFORMANCE OPTIMIZATIONS
# ================================
# All features are OPTIONAL and disabled by default for backward compatibility.
# Enable features one at a time and verify metrics remain stable.

performance_optimization:
  # Mixed Precision Training (AMP)
  # -------------------------------
  # Uses FP16 instead of FP32 for 40-60% faster training
  # Requires: Modern GPU with Tensor Cores (Volta+, compute capability ≥7.5)
  # Impact: 40-60% speedup, 30% lower GPU memory usage
  # Risk: May introduce minor (<0.5%) metric variation due to FP16 rounding
  use_mixed_precision: true

  # Asynchronous Checkpoint Uploads
  # ---------------------------------
  # Uploads MLflow checkpoints in background thread (non-blocking)
  # Impact: 5-10% reduction in I/O wait time
  # Risk: Low - graceful fallback on error
  async_checkpoint_upload: true

  # Checkpoint Save Throttling
  # ---------------------------
  # Minimum interval (seconds) between checkpoint saves
  # Set to 0 to save every improvement (default, no throttling)
  # Set to 30-60 to reduce I/O overhead from frequent improvements
  # Impact: 2-5% speedup by reducing checkpoint I/O frequency
  # Risk: May miss intermediate "best" models in rare cases
  checkpoint_save_interval_seconds: 30.0

# ================================
# OPTIMIZATION SETTINGS
# ================================

optimization:
  # Learning rate and optimizer
  warmup_epochs: 2
  init_lr: 0.0001
  max_lr: 0.001
  final_lr: 0.0001

  # Batch size and gradient accumulation
  batch_size: 128

  # Gradient Accumulation
  # ---------------------
  # Number of batches to accumulate before optimizer step
  # Effective batch size = batch_size × accumulate_grad_batches
  # Use this to simulate larger batches without OOM errors
  # Example: batch_size=128, accumulate_grad_batches=2 → effective batch_size=256
  # Impact: Neutral (user configurable for memory management)
  accumulate_grad_batches: 1  # 1 = no accumulation (default)

  # Data Loading Parallelization
  # -----------------------------
  # Number of worker processes for data loading
  # WARNING: Do NOT use num_workers > 0 with curriculum learning enabled!
  # See model.py:1130-1135 for details
  # Impact: 10-30% reduction in epoch time via improved GPU utilization
  # Safe to increase to 2-4 when curriculum learning is disabled
  num_workers: 4  # 0 = single-threaded (safe default)

  # Regularization
  weight_decay: 0.0

# ================================
# POST-TRAINING SETTINGS
# ================================

post_training:
  # GPU Metrics Computation
  # -----------------------
  # Accelerate post-training metrics using GPU
  # Options:
  #   "auto"  - Auto-detect GPU availability (recommended)
  #   "true"  - Force GPU usage (fails if GPU unavailable)
  #   "false" - Force CPU usage
  # Impact: 2-5× faster metrics computation when GPU available
  # Risk: None - automatic fallback to CPU
  use_gpu_metrics: auto

  # Other post-training settings
  compute_train_metrics: false     # Disable for 5-15% speedup
  generate_plots: false            # Disable for 3-10% speedup in production
  cache_predictions: true          # Enable for faster plot generation if needed

# ================================
# TRAINING SETTINGS
# ================================

training:
  max_epochs: 150
  patience: 50

  # MLflow experiment tracking
  experiment_name: chemprop_optimized_example

  # Random seed for reproducibility
  # NOTE: Mixed precision (FP16) may introduce minor variation even with fixed seed
  seed: 42

# ================================
# MODEL ARCHITECTURE
# ================================

hyperparams:
  message_passing:
    depth: 3
    undirected: true

  ffn:
    hidden_dim: 1200
    n_layers: 3
    dropout: 0.1
    activation: relu
    architecture: regression  # or mixture_of_experts, branched

# ================================
# DATA CONFIGURATION
# ================================

data:
  data_dir: data/processed
  # For ensemble training, point to parent directory of split_N/fold_M structure

# ================================
# PROFILING (OPTIONAL)
# ================================
# Use "phase" mode for production (lower overhead)
# Use "full" mode for detailed profiling

profiling:
  enabled: true
  mode: phase  # "phase" or "full"
  output_dir: profiling_output

# ================================
# CURRICULUM LEARNING (OPTIONAL)
# ================================
# WARNING: curriculum learning is incompatible with num_workers > 0!
# Set optimization.num_workers to 0 if enabling curriculum learning.

joint_sampling:
  curriculum:
    enabled: false  # Set to false to safely use num_workers > 0
    # If enabled, set optimization.num_workers to 0

# ================================
# ENSEMBLE CONFIGURATION (OPTIONAL)
# ================================
# Uncomment to enable ensemble training

# ensemble:
#   enabled: true
#   max_parallel: 4  # Number of parallel Ray workers (adjust based on GPU/CPU availability)
#   gpu_fraction: 0.2  # Fraction of GPU per worker (5 workers on 1 GPU)

# ================================
# USAGE NOTES
# ================================
#
# Conservative Approach (Recommended for First Use):
# ---------------------------------------------------
# 1. Start with use_mixed_precision: true only
# 2. Validate metrics within ±0.5% of baseline
# 3. Add async_checkpoint_upload: true
# 4. Validate again
# 5. Optionally add checkpoint throttling and increase num_workers
#
# Full Optimization (After Validation):
# --------------------------------------
# Enable all features as shown above for maximum speedup
#
# Rollback:
# ---------
# Set any optimization to false/0 to disable
# Example: use_mixed_precision: false reverts to FP32 training
#
# Monitoring:
# -----------
# Use profiling.enabled: true to measure speedup
# Check profiling_output/ for detailed timing breakdown
