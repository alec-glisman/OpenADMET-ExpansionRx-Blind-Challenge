data:
  data_dir: assets/dataset/split_train_val/v3/quality_high_medium_low/bitbirch/multilabel_stratified_kfold/data/split_0/fold_0
  test_file: assets/dataset/set/local_test.csv
  blind_file: assets/dataset/set/blind_test.csv
  output_dir: null
  smiles_col: SMILES
  target_cols:
    - LogD
    - Log KSOL
    - Log HLM CLint
    - Log MLM CLint
    - Log Caco-2 Permeability Papp A>B
    - Log Caco-2 Permeability Efflux
    - Log MPPB
    - Log MBPB
    - Log MGMB
  target_weights:
    - 1.5
    - 0.7
    - 1.0
    - 1.1
    - 1.4
    - 1.8
    - 1.3
    - 1.4
    - 0.7

joint_sampling:
  enabled: true
  task_oversampling:
    alpha: 0.02
  curriculum:
    enabled: true
    quality_col: Quality
    qualities:
      - high
      - medium
      - low
    patience: 20
    min_epochs_per_phase: 15
    strategy: sampled
    reset_early_stopping_on_phase_change: true
    log_per_quality_metrics: true
    seed: 42
    count_normalize: true
    min_high_quality_proportion: 0.50
    monitor_metric: val/mae
    early_stopping_metric: val/mae
    high_quality_metric: val/mae/high
    regression_threshold: 0.15
    adaptive_enabled: false
    adaptive_improvement_threshold: 0.02
    adaptive_max_adjustment: 0.1
    adaptive_lookback_epochs: 5
    loss_weighting_enabled: true
    loss_weights:
      high: 1.0
      medium: 0.7
      low: 0.4
  num_samples: null
  seed: 42
  increment_seed_per_epoch: true
  log_to_mlflow: true

model:
  type: chemprop
  chemprop:
    depth: 3
    message_hidden_dim: 700
    aggregation: norm
    ffn_type: regression
    num_layers: 4
    hidden_dim: 200
    dropout: 0.15
    batch_norm: true

optimization:
  criterion: MAE
  init_lr: 0.00113
  max_lr: 0.000227
  final_lr: 0.000113
  warmup_epochs: 5
  max_epochs: 400
  patience: 40
  batch_size: 128
  num_workers: 0 # Must be 0 with curriculum - sampler state not synchronized across workers
  accumulate_grad_batches: 1
  seed: 42
  weight_decay: 0.0
  progress_bar: false
performance_optimization:
  use_mixed_precision: true

inter_task_affinity:
  enabled: false
  compute_every_n_steps: 2
  log_every_n_steps: 10
  log_epoch_summary: true
  log_step_matrices: false
  lookahead_lr: 0.001
  use_optimizer_lr: true
  exclude_param_patterns:
    - predictor
    - ffn
    - output
    - head
    - readout
  log_to_mlflow: true

mlflow:
  tracking: true
  tracking_uri: http://127.0.0.1:8084
  experiment_name: chemprop_curriculum_learning
  run_name: null
  nested: false

target_clipping:
  enabled: true
  apply_to_individual_models: false
  apply_after_ensemble: true
  clip_ranges:
    LogD: [-3, 7]
    Log KSOL: [-3, 2.52]
    Log HLM CLint: [-1.31, 4.5]
    Log MLM CLint: [-1.31, 4.5]
    Log Caco-2 Permeability Papp A>B: [-3.0, 2.0]
    Log Caco-2 Permeability Efflux: [-0.75, 2.8]
    Log MPPB: [-6.0, 2.0]
    Log MBPB: [-6.0, 2.0]
    Log MGMB: [-6.0, 2.0]
