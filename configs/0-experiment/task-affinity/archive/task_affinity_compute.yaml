data:
  data_dir: assets/dataset/split_train_val/v3/quality_high/bitbirch/multilabel_stratified_kfold/data/split_0/fold_0
  smiles_col: SMILES
  target_cols:
    - LogD
    - Log KSOL
    - Log HLM CLint
    - Log MLM CLint
    - Log Caco-2 Permeability Papp A>B
    - Log Caco-2 Permeability Efflux
    - Log MPPB
    - Log MBPB
    - Log MGMB
task_affinity:
  affinity_epochs: 2
  affinity_batch_size: 64
  affinity_lr: 0.001
  affinity_type: cosine
  normalize_gradients: true
  n_groups: 3
  clustering_method: agglomerative
  device: auto
  seed: 42
  log_affinity_matrix: true
inter_task_affinity:
  enabled: true
  compute_every_n_steps: 1
  log_every_n_steps: 50
  log_epoch_summary: true
  log_step_matrices: true
  lookahead_lr: 0.001
  use_optimizer_lr: true
  exclude_param_patterns:
    - predictor
    - ffn
    - output
    - head
    - readout
  log_to_mlflow: true
  save_plots: true
  plot_formats:
    - png
  plot_dpi: 150
model:
  type: chemprop
  chemprop:
    depth: 5
    message_hidden_dim: 600
    num_layers: 2
    hidden_dim: 600
    dropout: 0.1
    batch_norm: true
    ffn_type: regression
    trunk_n_layers: 2
    trunk_hidden_dim: 600
    n_experts: 4
optimization:
  criterion: MSE
  epochs: 3
  batch_size: 64
  learning_rate: 0.001
  scheduler: constant
  warmup_epochs: 0
  max_lr: 0.001
  final_lr: 0.001
  optimizer: Adam
  weight_decay: 0.0
  gradient_clip: null
  patience: 999
  min_delta: 0.0
mlflow:
  experiment_name: Default
  run_name: null
  tracking_uri: mlruns
  log_models: false
  log_plots: true
post_training:
  generate_plots: true
  plot_dpi: 150
  plot_formats:
    - png
  cache_predictions: true
  compute_test_metrics: true
  compute_train_metrics: false
seed: 42
device: auto
log_level: INFO
log_frequency: 10
output:
  affinity_matrix_path: results/task_affinity_matrix.npz
  affinity_csv_path: results/task_affinity_matrix.csv
  heatmap_path: results/task_affinity_heatmap.png
  groups_json_path: results/task_groups.json
  heatmap_figsize:
    - 10
    - 8
  heatmap_cmap: RdBu_r
  heatmap_dpi: 150
logging:
  enabled: true
  verbose: 0
  max_total_logs_gb: 1.0
  fail_on_upload_error: true
target_clipping:
  enabled: true
  apply_to_individual_models: false
  apply_after_ensemble: true
  clip_ranges:
    LogD: [-3, 7]
    Log KSOL: [-3, 2.52]
    Log HLM CLint: [-1.31, 4.5]
    Log MLM CLint: [-1.31, 4.5]
    Log Caco-2 Permeability Papp A>B: [-3.0, 2.0]
    Log Caco-2 Permeability Efflux: [-0.75, 2.8]
    Log MPPB: [-6.0, 2.0]
    Log MBPB: [-6.0, 2.0]
    Log MGMB: [-6.0, 2.0]
