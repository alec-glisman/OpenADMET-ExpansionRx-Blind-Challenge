model:
  type: chemeleon
  chemeleon:
    checkpoint_path: auto
    ffn_type: regression
    ffn_hidden_dim: 300
    ffn_num_layers: 2
    dropout: 0.0
    batch_norm: false
    unfreeze_schedule:
      freeze_encoder: true
      unfreeze_encoder_epoch: null
      unfreeze_encoder_lr_multiplier: 0.1
data:
  data_dir: assets/dataset/split_train_val/v3/quality_high/bitbirch/multilabel_stratified_kfold/data/split_0/fold_0
  smiles_col: SMILES
  target_cols:
  - LogD
  - Log KSOL
  - Log SFM
  - Log HLM
  - Log RLM
  - Log Papp
optimization:
  max_epochs: 100
  batch_size: 32
  patience: 15
  learning_rate: 0.0001
mlflow:
  enabled: true
  experiment_name: chemeleon
  tracking_uri: null
logging:
  enabled: true
  verbose: 0
  max_total_logs_gb: 1.0
  fail_on_upload_error: true
