model:
  chemprop:
    model:
      depth: 5
      message_hidden_dim: 600
      hidden_dim: 600
      num_layers: 2
      dropout: 0.1
      batch_norm: true
      ffn_type: regression
      aggregation: mean
    optimization:
      max_epochs: 150
      patience: 15
      batch_size: 32
      init_lr: 0.0001
      max_lr: 0.001
      final_lr: 0.0001
      warmup_epochs: 5
      criterion: MAE
      weight_decay: 1.0e-05
      num_workers: 4 # OPTIMIZATION: Enable parallel data loading (10-20% speedup when curriculum disabled)
      use_mixed_precision: true # OPTIMIZATION: FP16 training (1.8-2x speedup on RTX 3080, 1.3-1.5x on GTX 1080 Ti)
      accumulate_grad_batches: 1 # OPTIMIZATION: Gradient accumulation (1 = disabled, increase for larger effective batch)
data:
  data_dir: /path/to/data
  smiles_col: SMILES
  target_cols:
    - LogD
    - Log KSOL
    - Log HLM CLint
    - Log MLM CLint
    - Log Caco-2 Permeability Papp A>B
    - Log Caco-2 Permeability Efflux
    - Log MPPB
    - Log MBPB
    - Log MGMB
mlflow:
  enabled: true
  experiment_name: weight_decay_experiment
post_training:
  generate_plots: true
  plot_dpi: 150
  plot_formats:
    - png
  cache_predictions: true
  compute_test_metrics: true
  compute_train_metrics: false
logging:
  enabled: true
  verbose: 0
  max_total_logs_gb: 1.0
  fail_on_upload_error: true
