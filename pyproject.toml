[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
dependencies = [
    # data science
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scipy==1.16.3",
    # cheminformatics
    "chemprop==2.2.1",
    "rdkit==2023.9.6",
    "useful_rdkit_utils==0.92",
    "mordredcommunity==2.0.6",
    # machine learning
    "statsmodels==0.14.5",
    "scikit-learn==1.7.2",
    "iterative-stratification==0.1.9",
    "numba==0.60.0; sys_platform == 'darwin'",        # Has pre-built wheels for macOS Python 3.11
    "numba>=0.59.0,<0.64.0; sys_platform == 'linux'", # Keep compatible with Linux CUDA builds
    "umap-learn==0.5.9.post2",
    "hdbscan==0.8.40",
    "lightgbm==4.6.0",
    "xgboost==3.1.2",
    "catboost==1.2.8",
    # deep learning - CPU-only for macOS
    "torch==2.2.2; sys_platform == 'darwin'",
    "torchaudio==2.2.2; sys_platform == 'darwin'",
    "torchvision==0.17.2; sys_platform == 'darwin'",
    "ray[data,train,tune,serve]==2.49.0; sys_platform == 'darwin'",
    "pytorch-lightning==2.5.4; sys_platform == 'darwin'",
    # deep learning - CUDA-enabled for Linux
    "torch==2.7.1; sys_platform == 'linux'",
    "torchaudio==2.7.1; sys_platform == 'linux'",
    "torchvision==0.22.1; sys_platform == 'linux'",
    "torchmetrics==1.0.3",
    "ray[data,train,tune,serve]==2.52.0; sys_platform == 'linux'",
    "pytorch-lightning==2.5.4; sys_platform == 'linux'",           # Compatible with PyTorch 2.7.1
    # ML infra
    "mlflow==3.6.0",
    "anyio==4.11.0",
    "nvidia-ml-py==13.580.82",
    "psutil==7.1.3",
    "psycopg2-binary==2.9.11",
    # "psycopg2",
    "transformers==4.50.3",
    "gradio-client==2.0.1",
    # Bayesian optimization for HPO
    "optuna==4.6.0",
    "bayesian-optimization==3.2.0",
    "hyperopt==0.2.7",
    # visualization
    "matplotlib==3.10.7",
    "seaborn==0.13.2",
    "colorcet==3.1.0",
    "scienceplots==2.1.1",
    # datasets & data download
    "polaris-lib==0.13.0",
    "datasets==2.19.1",
    "pytdc==0.4.1",
    # CLI, testing, typing
    "typer==0.20.0",
    "rich==14.2.0",
    "pytest==9.0.1",
    # util
    "tqdm==4.66.5",
    "requests==2.28.1",
    "omegaconf==2.3.0",
    "joblib==1.5.2",
    # jupyter
    "jupyter==1.1.1",
    "ipympl==0.9.8",
    "ipywidgets==8.1.8",
    "ipykernel==7.1.0",
    # # marimo
    # "marimo",
    # "altair",
]
name = "openadmet-challenge"
authors = [{ name = "Alec Glisman" }]
dynamic = ["version"]
description = "Tools and experiments for the OpenADMET challenge"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
keywords = [
    "ADMET",
    "cheminformatics",
    "machine learning",
    "deep learning",
    "drug discovery",
]
requires-python = ">=3.11,<3.12"


[project.optional-dependencies]
dev = [
    "pip",
    "black==25.11.0",
    "isort==7.0.0",
    "flake8==7.3.0",
    "mypy==1.18.2",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
    "pre-commit==4.5.0",
    "nbstripout==0.8.2",
    "beautysh==6.4.2",
    "shfmt-py==3.12.0.2",
    "pylint==4.0.3",
    "commitizen==4.10.0",
]
docs = [
    "sphinx==7.3.7",
    "sphinx-autodoc-typehints==2.3.0",
    "sphinx-autobuild==2025.8.25",
    "sphinx-copybutton==0.5.2",
    "sphinx-design==0.6.1",
    "sphinx-rtd-theme==3.0.2",
    "furo==2025.9.25",
    "sphinxext-opengraph==0.13.0",
    "sphinx-tabs==3.4.7",
    "sphinx-panels==0.4.1",
    "myst-parser==4.0.1",
]

[project.scripts]
# Provide a convenient `admet` CLI entrypoint. Points to the package __main__.py main().
admet = "admet.cli.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "admet.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
# Linux: Use CUDA-enabled PyTorch from pytorch-cuda index
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]

[tool.isort]
profile = "black"
line_length = 120
combine_as_imports = true
src_paths = ["src"]
skip_glob = ["src/bitbirch/**"]

[tool.flake8]
max-line-length = 120
extend-ignore = ['E203', 'W503', 'BLE001']
exclude = [
    '.git',
    '__pycache__',
    '.venv',
    'env',
    'build',
    'dist',
    'src/bitbirch',
    'notebooks',
]

[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = '''
/(
  src/bitbirch
)/
'''

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
strict = false
exclude = ["tests/.*", "src/bitbirch", "archive", "scripts/"]
# Disable cache to avoid corruption from parallel pre-commit runs
cache_dir = ".mypy_cache"
incremental = false
skip_version_check = true

[tool.mypy-rdkit]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "rdkit.*"
ignore_errors = true

[tool.pylint.main]
max-locals = 15
max-attributes = 10
min-similarity-lines = 5
ignore-imports = true
good-names = [
    "i",
    "j",
    "k",
    "ex",
    "Run",
    "_",
    "x",
    "y",
    "df",
    "ax",
    "X",
    "y",
    "n",
    "m",
]
ignore-paths = ["src/bitbirch", "src/admet/train/_ray_test_stubs.py"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "fixme",
    "suppressed-message",
    "invalid-name",
    "useless-suppression",
    "too-few-public-methods",
    "import-outside-toplevel",
    "broad-exception-caught",
    "unnecessary-pass",
]

[tool.pylint.reports]
output-format = "colorized"
score = true
evaluation = "9.0"
fail-under = 9.0

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short -m 'not no_mlflow_runs'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "no_mlflow_runs: marks tests that require MLflow runs and should not be run by default",
    "benchmark: Performance benchmark tests (pytest-benchmark)",
]

[tool.coverage.run]
source = ["src/admet"]
omit = ["*/tests/*", "*/test_*.py", "src/bitbirch/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if sys.version_info",
]
precision = 2
